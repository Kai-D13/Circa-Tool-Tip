name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No dependencies to install yet: packages/guide-schema is dependency-free and
      # Node 24 runs its TypeScript directly. apps/* will add a pnpm install step.
      - name: Syntax gate
        run: node scripts/check-syntax.mjs

      # Includes the importer tests, which run the real pipeline over a synthetic
      # fixture: the production export contains customer data and is not in the repo.
      - name: Unit tests
        run: node --test "packages/guide-schema/tests/*.test.mjs" "scripts/import-legacy/*.test.mjs"
