name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # packages/ and scripts/ are dependency-free and run on Node 24 directly.
      - name: Syntax gate
        run: node scripts/check-syntax.mjs

      # Includes the importer tests, which run the real pipeline over a synthetic
      # fixture: the production export contains customer data and is not in the repo.
      - name: Unit tests
        run: node --test "packages/guide-schema/tests/*.test.mjs" "scripts/import-legacy/*.test.mjs"

      # Admin Portal: pure logic tests, typecheck, and a real production build. The
      # build needs no Supabase credentials - env is only read at request time.
      - name: Admin Portal tests
        run: pnpm --filter admin test

      - name: Admin Portal typecheck
        run: pnpm --filter admin typecheck

      - name: Admin Portal build
        run: pnpm --filter admin build
