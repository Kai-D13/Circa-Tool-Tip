name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No dependencies to install yet: packages/guide-schema is dependency-free and
      # Node 24 runs its TypeScript directly. apps/* will add a pnpm install step.
      - name: Syntax gate
        run: node scripts/check-syntax.mjs

      - name: Unit tests
        run: node --test "packages/guide-schema/tests/*.test.mjs"

      # The importer must stay reproducible: re-running it against the same source file
      # has to produce a byte-identical artifact. This only runs when the source file is
      # present, which it is not on CI, so it is a placeholder until a redacted fixture
      # is committed.
      - name: Importer reproducibility (skipped without source)
        run: echo "TODO Batch 1B - commit a redacted fixture so this can run on CI"
